name: tefy-blog-dev

services:
  frontend:
    build:
      context: ./Build Tefy Literary Journal
      dockerfile: Dockerfile
      target: development
    init: true
    environment:
      PORT: 8443
      FIGMA_DEV_SERVER_HOST: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-8443}:8443"
    volumes:
      - ./Build Tefy Literary Journal:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8443').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    init: true
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-blog_dev}:${MONGO_ROOT_PASSWORD:-change-me-local}@mongo:27017/${MONGO_DATABASE:-blog}?authSource=admin&replicaSet=rs0
      MONGO_DATABASE: ${MONGO_DATABASE:-blog}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-local-admin}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-blog_dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me-local}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-blog}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --eval 'try { rs.status().ok ? quit(0) : quit(1) } catch (e) { if (e.codeName === "NotYetInitialized") { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}); quit(0) } quit(1) }'
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo_data:
  frontend_node_modules:
