name: Required checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and SEO checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Build Tefy Literary Journal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Build Tefy Literary Journal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Test frontend utilities and generate LCOV coverage
        run: pnpm exec c8 --all --include='src/lib/**/*.mjs' --exclude='tests/**' --reports-dir=coverage --reporter=lcov --reporter=text node --test tests/*.test.mjs
      - name: Make LCOV paths relative to the repository root
        run: sed -i 's#SF:src/#SF:Build Tefy Literary Journal/src/#' coverage/lcov.info
      - name: Test taxonomy and public UI with coverage
        run: pnpm test:ui
      - name: Make component LCOV paths relative to the repository root
        run: sed -i 's#SF:src/#SF:Build Tefy Literary Journal/src/#' coverage/vitest/lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            Build Tefy Literary Journal/coverage/lcov.info
            Build Tefy Literary Journal/coverage/vitest/lcov.info
      - name: Type-check frontend
        run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Verify generated SEO assets
        run: node scripts/check-seo.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend and generate coverage
        working-directory: backend
        run: mkdir -p ../coverage && go test -coverprofile=../coverage/backend.out ./...
      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend.out
      - name: Vet and build backend
        working-directory: backend
        run: go vet ./... && go build ./...

  sonarqube:
    name: SonarQube analysis
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Build Tefy Literary Journal/coverage
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: coverage
      - name: Analyze with SonarQube
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectKey=blog-tefy -Dsonar.qualitygate.wait=true

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development configuration
        run: docker compose --env-file .env.example -f compose.yaml config --quiet
      - name: Validate production configuration
        run: docker compose --env-file .env.example -f compose.production.yaml config --quiet
      - name: Validate integration configuration
        run: docker compose --env-file .env.example -f compose.production.yaml -f compose.integration.yaml config --quiet

  integration:
    name: Frontend to backend integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Exercise proxy, login, and runtime environment settings
        run: sh scripts/test-compose-proxy.sh
