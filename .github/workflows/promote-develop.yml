name: Promote develop to main

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Create or reuse promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            echo "Promotion PR #$existing already exists"
          else
            gh pr create --base main --head develop \
              --title "Promote develop to main" \
              --body "Promotion PR generated by the Promote develop to main workflow. CI must pass before merging."
          fi
